<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrés Machado | Pitch Interactivo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a; /* Slate 900 - Fondo oscuro profesional */
            font-family: 'Courier New', Courier, monospace; /* Fuente estilo código */
        }
        
        canvas {
            display: block;
        }

        /* Overlay para simular pantalla antigua (opcional, estilo hacker) */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.882);
            font-family: sans-serif;
            font-size: 12px;
            pointer-events: none;
            z-index: 20;
            text-align: right;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00E676;
            font-size: 24px;
            display: none; /* Se mostrará si tarda en cargar */
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div id="loading">Inicializando Sistema...</div>
    <div id="controls">
        Navegación: Flechas ⬅ ➡ o Clic<br>
        F11 para Pantalla Completa
    </div>
    
    <!-- Video para Proyecto Insignia -->
    <video id="projectVideo" src="Reconocimiento de imagen.mp4" muted loop style="display:none;"></video>
    
    <!-- Imagen para Perfil Profesional -->
    <img id="profileImage" src="Gemini_Generated_Image_iil6woiil6woiil6.png" style="display:none;">
    
    <canvas id="presentationCanvas"></canvas>

    <script>
        /**
         * PITCH INTERACTIVO - ANDRÉS MACHADO
         * Renderizado en HTML5 Canvas Nativo
         */

        const canvas = document.getElementById('presentationCanvas');
        const ctx = canvas.getContext('2d');
        const projectVideo = document.getElementById('projectVideo');
        const profileImage = document.getElementById('profileImage');

        // --- CONFIGURACIÓN VISUAL ---
        let width, height;
        let currentSlide = 0;
        let particles = [];
        
        // Paleta de colores Grupo Bolívar + Tech
        const COLORS = {
            bg: '#0f172a',
            green: '#00E676', // Verde Neón
            gold: '#FFD700',  // Dorado (Insignia/Beca)
            white: '#F8FAFC',
            gray: '#FFFFFF',
            line: 'rgba(0, 230, 118, ' // Base para líneas transparentes
        };

        // --- CONTENIDO DE LAS DIAPOSITIVAS ---
        const slides = [
            {
                id: 'hero',
                type: 'center',
                title: "ANDRÉS FELIPE MACHADO OLIVERO",
                subtitle: "Ingeniero Electrónico y Telecomunicaciones | Desarrollador IoT | Innovador",
                badge: "🏆 INSIGNIA: REINVENTOR DEL ÉXITO - GRUPO BOLÍVAR 2025",
                content: [
                    "CERTIFICACIÓN: SIT"
                ]
            },
            {
                id: 'profile',
                type: 'left',
                title: "PERFIL PROFESIONAL",
                subtitle: "El puente entre Hardware y Negocio",
                image: true,
                content: [
                    "• Estudiante 10° Semestre Ing. Electrónica",
                    "• 🎓 GANADOR BECA ACADÉMICA 2025-2",
                    "• Pasante: Domo de Innovación (Grupo Bolívar)",
                    "• Experiencia real transformando hacia 'AI Company'"
                ]
            },
            {
                id: 'project',
                type: 'left',
                title: "PROYECTO INSIGNIA",
                subtitle: "Semaforización Inteligente (Tesis)",
                video: true,
                content: [
                    "• PROBLEMA: Congestión crítica Carrera 15",
                    "• SOLUCIÓN: Control Adaptativo IoT + Visión Artificial",
                    "• STACK: Python (TraCI), SUMO, ESP32, OpenCV",
                    "• RESULTADO: Reducción tiempos de espera y CO2",
                    "• (Validado mediante simulación de tráfico)"
                ]
            },
            {
                id: 'skills',
                type: 'grid',
                title: "STACK TECNOLÓGICO",
                subtitle: "Herramientas de Alto Impacto",
                content: [
                    { icon: "⚛️", text: "React & HTML5", category: "Frontend", level: 70 },
                    { icon: "⚡", text: "N8N & Make", category: "Automatización", level: 95 },
                    { icon: "🐍", text: "Python & OpenCV", category: "Backend/IA", level: 75 },
                    { icon: "🤖", text: "ESP32 & IoT", category: "Hardware", level: 95 },
                    { icon: "🗄️", text: "SQL & MongoDB", category: "Bases de Datos", level: 60 },
                    { icon: "☁️", text: "Git & Docker", category: "DevOps", level: 60 }
                ]
            },
            {
                id: 'why',
                type: 'center',
                title: "ADN BOLÍVAR: CONFIRMADO",
                subtitle: "No busco un trabajo. Busco transformar.",
                badge: "🚀 LISTO PARA EL DESPLIEGUE",
                content: [
                    "✓ Conozco Bolívar desde adentro: su cultura",
                    "✓ Ya demostré resultados en el Domo de Innovación",
                    "✓ Combino Hardware + Software + Visión de Negocio",
                    "",
                    "\"El futuro no se espera, se construye con código.\"",
                    "",
                    "📞 +57 312 716 5610  |  📧 machadoandres1508@gmail.com"
                ]
            }
        ];

        // --- CLASE PARTÍCULA (Simula Nodos/Red Neuronal) ---
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.size = Math.random() * 3 + 1;
                // 20% probabilidad de ser dorada (destacada), resto verde
                this.color = Math.random() > 0.8 ? COLORS.gold : COLORS.green; 
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Rebote en bordes
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // --- FUNCIONES DEL SISTEMA ---
        function init() {
            resize();
            // Crear nodos
            particles = [];
            const particleCount = Math.floor((width * height) / 15000); // Dinámico según pantalla
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        ctx.beginPath();
                        // Opacidad basada en distancia
                        ctx.strokeStyle = `${COLORS.line}${1 - distance / 120})`;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function drawContent() {
            const slide = slides[currentSlide];
            const cx = width / 2;
            const cy = height / 2;

            ctx.textAlign = slide.type === 'left' ? 'left' : 'center';
            ctx.textBaseline = 'middle';

            // Ajuste de posición para diferentes tipos de slide
            let titleOffsetY, subtitleOffsetY, badgeOffsetY, contentOffsetY;
            if (slide.type === 'grid') {
                titleOffsetY = -220;
                subtitleOffsetY = -170;
                badgeOffsetY = -30;
                contentOffsetY = 0;
            } else if (slide.id === 'hero') {
                // Primera sección - centrada
                titleOffsetY = -80;
                subtitleOffsetY = -20;
                badgeOffsetY = 40;
                contentOffsetY = 100;
            } else if (slide.id === 'why') {
                // Última sección - más arriba
                titleOffsetY = -180;
                subtitleOffsetY = -120;
                badgeOffsetY = -60;
                contentOffsetY = -10;
            } else {
                titleOffsetY = -150;
                subtitleOffsetY = -90;
                badgeOffsetY = -30;
                contentOffsetY = 0;
            }

            // 1. TÍTULO
            ctx.font = 'bold 50px "Courier New"';
            ctx.fillStyle = COLORS.white;
            // Efecto sombra neón
            ctx.shadowBlur = 15;
            ctx.shadowColor = COLORS.green;
            
            if (slide.type === 'left') {
                ctx.fillText(slide.title, 100, cy - 150);
            } else {
                ctx.fillText(slide.title, cx, cy + titleOffsetY);
            }
            ctx.shadowBlur = 0; // Reset

            // 2. SUBTÍTULO
            ctx.font = '28px sans-serif';
            ctx.fillStyle = COLORS.green;
            if (slide.type === 'left') {
                ctx.fillText(slide.subtitle, 100, cy - 100);
            } else {
                ctx.fillText(slide.subtitle, cx, cy + subtitleOffsetY);
            }

            // 3. BADGE (Si existe)
            if (slide.badge) {
                ctx.font = 'bold 20px sans-serif';
                ctx.fillStyle = COLORS.gold;
                ctx.fillText(slide.badge, cx, cy + badgeOffsetY);
            }

            // 4. CONTENIDO
            ctx.fillStyle = COLORS.gray;
            ctx.font = '24px sans-serif';
            
            if (slide.type === 'grid') {
                // Renderizado especial para GRID con barras de nivel
                const cols = 2;
                const cardWidth = 400;
                const cardHeight = 110;
                const gapX = 40;
                const gapY = 30;
                const totalWidth = (cols * cardWidth) + ((cols - 1) * gapX);
                const startX = cx - totalWidth / 2;
                const startY = cy - 100;
                
                slide.content.forEach((item, i) => {
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    const px = startX + (col * (cardWidth + gapX));
                    const py = startY + (row * (cardHeight + gapY));
                    
                    // Fondo de tarjeta semi-transparente
                    ctx.fillStyle = 'rgba(0, 230, 118, 0.1)';
                    ctx.strokeStyle = COLORS.green;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(px, py, cardWidth, cardHeight, 10);
                    ctx.fill();
                    ctx.stroke();
                    
                    // Icono grande
                    ctx.font = '38px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(item.icon, px + 15, py + 50);
                    
                    // Categoría (pequeña, arriba)
                    ctx.font = 'bold 12px sans-serif';
                    ctx.fillStyle = COLORS.green;
                    ctx.fillText(item.category.toUpperCase(), px + 70, py + 28);
                    
                    // Texto principal
                    ctx.font = 'bold 18px sans-serif';
                    ctx.fillStyle = COLORS.white;
                    ctx.fillText(item.text, px + 70, py + 52);
                    
                    // Barra de nivel
                    const barWidth = 180;
                    const barHeight = 8;
                    const barX = px + 70;
                    const barY = py + 72;
                    
                    // Fondo de la barra
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.roundRect(barX, barY, barWidth, barHeight, 4);
                    ctx.fill();
                    
                    // Progreso de la barra
                    const progress = (item.level / 100) * barWidth;
                    ctx.fillStyle = item.level >= 90 ? COLORS.gold : COLORS.green;
                    ctx.beginPath();
                    ctx.roundRect(barX, barY, progress, barHeight, 4);
                    ctx.fill();
                    
                    // Porcentaje
                    ctx.font = 'bold 12px sans-serif';
                    ctx.fillStyle = COLORS.white;
                    ctx.fillText(item.level + '%', barX + barWidth + 10, barY + 8);
                });

            } else {
                // Renderizado lista normal
                let startY = slide.badge ? cy + contentOffsetY : cy + contentOffsetY - 20;
                const lineHeight = 40;
                
                slide.content.forEach((line, i) => {
                    const isHighlight = line.includes('El futuro no se espera');
                    const prevFont = ctx.font;
                    const prevFill = ctx.fillStyle;

                    if (isHighlight) {
                        ctx.font = 'bold 32px sans-serif';
                        ctx.fillStyle = COLORS.gold;
                    }

                    if (slide.type === 'left') {
                        ctx.fillText(line, 100, startY + (i * lineHeight));
                    } else {
                        ctx.textAlign = 'center';
                        ctx.fillText(line, cx, startY + (i * lineHeight));
                    }

                    if (isHighlight) {
                        ctx.font = prevFont;
                        ctx.fillStyle = prevFill;
                    }
                });
            }

            // 5. IMAGEN (Si existe en el slide)
            if (slide.image) {
                // Calcular dimensiones de la imagen (lado derecho de la pantalla)
                const imgWidth = 600;
                const imgHeight = 450;
                const imgX = width - imgWidth - 80;
                const imgY = cy - imgHeight / 2;
                
                // Dibujar marco de la imagen
                ctx.strokeStyle = COLORS.green;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = COLORS.green;
                ctx.strokeRect(imgX - 5, imgY - 5, imgWidth + 10, imgHeight + 10);
                ctx.shadowBlur = 0;
                
                // Dibujar la imagen en el canvas
                ctx.drawImage(profileImage, imgX, imgY, imgWidth, imgHeight);
            }

            // 6. VIDEO (Si existe en el slide)
            if (slide.video) {
                // Calcular dimensiones del video (lado derecho de la pantalla)
                const videoWidth = 550;
                const videoHeight = 400;
                const videoX = width - videoWidth - 80;
                const videoY = cy - videoHeight / 2;
                
                // Reproducir video si no está reproduciéndose
                if (projectVideo.paused) {
                    projectVideo.play();
                }
                
                // Dibujar marco del video
                ctx.strokeStyle = COLORS.green;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = COLORS.green;
                ctx.strokeRect(videoX - 5, videoY - 5, videoWidth + 10, videoHeight + 10);
                ctx.shadowBlur = 0;
                
                // Dibujar el video en el canvas
                ctx.drawImage(projectVideo, videoX, videoY, videoWidth, videoHeight);
                
                // Etiqueta del video
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = COLORS.green;
                ctx.textAlign = 'center';
                ctx.fillText('🎬 Reconocimiento de Imagen', videoX + videoWidth / 2, videoY + videoHeight + 30);
            } else {
                // Pausar video si no estamos en el slide correspondiente
                if (!projectVideo.paused) {
                    projectVideo.pause();
                }
            }

            // 6. BARRA DE PROGRESO INFERIOR
            const barWidth = (width / slides.length) * (currentSlide + 1);
            ctx.fillStyle = COLORS.green;
            ctx.fillRect(0, height - 6, barWidth, 6);
        }

        function animate() {
            // Limpiar canvas
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, width, height);

            // Dibujar fondo interactivo
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            drawConnections();

            // Dibujar texto encima
            drawContent();

            requestAnimationFrame(animate);
        }

        // --- CONTROLADORES DE EVENTOS ---
        window.addEventListener('resize', resize);

        // Teclado
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if (currentSlide < slides.length - 1) currentSlide++;
            }
            if (e.key === 'ArrowLeft') {
                if (currentSlide > 0) currentSlide--;
            }
        });

        // Mouse (Clic derecho avanza, izquierdo retrocede, o zonas pantalla)
        window.addEventListener('click', (e) => {
            if (e.clientX > width / 2) {
                if (currentSlide < slides.length - 1) currentSlide++;
            } else {
                if (currentSlide > 0) currentSlide--;
            }
        });

        // Iniciar
        init();

    </script>
</body>
</html>
